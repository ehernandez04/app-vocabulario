services:
  # Desarrollo con recarga en caliente: http://localhost:5173
  # El service worker funciona en localhost sin HTTPS.
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules          # las dependencias de la imagen, no las del host
    environment:
      - CHOKIDAR_USEPOLLING=true   # para que Vite vea los cambios desde el volumen
    profiles: ["dev"]

  # Producción: nginx sirviendo el build. http://localhost:8080
  web:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    restart: unless-stopped
