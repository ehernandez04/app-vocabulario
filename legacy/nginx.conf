server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 512;

  # Los assets llevan hash en el nombre, así que pueden cachearse para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /audio/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # El service worker NO se cachea: si se queda pegado, la app no se actualiza nunca.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache";
    expires off;
  }
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # App de una sola página: cualquier ruta cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
