<script type="text/x-dc" data-dc-script="" data-props="{&quot;postit&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFE066&quot;,&quot;options&quot;:[&quot;#FFE066&quot;,&quot;#FFB4A2&quot;,&quot;#B8E1FF&quot;,&quot;#C8F0A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { i: 0, revealed: false, known: 0 };

  words = [
    { en: 'the way', ipa: '/ðə weɪ/', es: 'el camino', exEn: 'I listen to podcasts on the way to work.', exEs: 'Escucho pódcasts de camino al trabajo.' },
    { en: 'to achieve', ipa: '/əˈtʃiːv/', es: 'lograr', exEn: 'We achieved our goal this month.', exEs: 'Logramos nuestro objetivo este mes.' },
    { en: 'however', ipa: '/haʊˈevər/', es: 'sin embargo', exEn: 'It was late; however, we kept working.', exEs: 'Era tarde; sin embargo, seguimos trabajando.' },
    { en: 'reliable', ipa: '/rɪˈlaɪəbəl/', es: 'fiable', exEn: 'This machine is very reliable.', exEs: 'Esta máquina es muy fiable.' },
    { en: 'meanwhile', ipa: '/ˈmiːnwaɪl/', es: 'mientras tanto', exEn: 'Meanwhile, the coil was cooling down.', exEs: 'Mientras tanto, la bobina se enfriaba.' },
    { en: 'to struggle', ipa: '/ˈstrʌɡəl/', es: 'tener dificultades', exEn: 'I struggle with phrasal verbs.', exEs: 'Me cuestan los phrasal verbs.' },
    { en: 'outcome', ipa: '/ˈaʊtkʌm/', es: 'resultado', exEn: 'The outcome was better than expected.', exEs: 'El resultado fue mejor de lo esperado.' },
    { en: 'to remind', ipa: '/rɪˈmaɪnd/', es: 'recordar (a alguien)', exEn: 'Remind me to call him later.', exEs: 'Recuérdame llamarle luego.' }
  ];

  speak(text, lang) {
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      s.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.9;
      s.speak(u);
    } catch (e) {}
  }

  next(knew) {
    const i = (this.state.i + 1) % this.words.length;
    this.setState({ i: i, revealed: false, known: this.state.known + (knew ? 1 : 0) });
    const nw = this.words[i];
    setTimeout(() => this.speak(nw.en, 'en-US'), 150);
  }

  componentWillUnmount() {
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  }

  renderVals() {
    const n = this.words.length;
    const w = this.words[this.state.i];
    const k = this.state.known;
    return {
      postit: this.props.postit ?? '#FFE066',
      w: w,
      counter: (this.state.i + 1) + ' / ' + n,
      progress: Math.round(((this.state.i + 1) / n) * 100) + '%',
      revealed: this.state.revealed,
      hidden: !this.state.revealed,
      knownLabel: k === 1 ? 'Has acertado 1 palabra en esta sesión' : 'Has acertado ' + k + ' palabras en esta sesión',
      listenEn: () => this.speak(w.en, 'en-US'),
      listenEs: () => this.speak(w.es, 'es-ES'),
      listenEx: () => this.speak(w.exEn, 'en-US'),
      reveal: () => { this.setState({ revealed: true }); this.speak(w.es, 'es-ES'); },
      again: () => this.next(false),
      gotIt: () => this.next(true)
    };
  }
}
</script>
