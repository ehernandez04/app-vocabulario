<span style="font-size: 15px; color: #CFC8B8">Ponte los auriculares y guarda el móvil: oyes la palabra en inglés, piensas, y luego la respuesta en español.</span>
</div>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #4A463F">{{phaseLabel}}</span>

</button>
<button aria-label="{{playAria}}" sc-camel-on-click="{{toggle}}" style="width: 96px; height: 96px; border-radius: 48px; border: none; background: #FFE066; color: #1C1B19; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 8px 24px rgba(255, 224, 102, 0.25)">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;postit&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFE066&quot;,&quot;options&quot;:[&quot;#FFE066&quot;,&quot;#FFB4A2&quot;,&quot;#B8E1FF&quot;,&quot;#C8F0A8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { i: 0, phase: 'idle', playing: false, pause: 5 };

  words = [
    { en: 'the way', es: 'el camino' },
    { en: 'to achieve', es: 'lograr' },
    { en: 'however', es: 'sin embargo' },
    { en: 'reliable', es: 'fiable' },
    { en: 'meanwhile', es: 'mientras tanto' },
    { en: 'to struggle', es: 'tener dificultades' },
    { en: 'outcome', es: 'resultado' },
    { en: 'to remind', es: 'recordar' }
  ];

  say(text, lang, done) {
    let fired = false;
    const fin = () => { if (fired) return; fired = true; if (done) done(); };
    try {
      const s = window.speechSynthesis;
      if (!s) { this.t = setTimeout(fin, 1200); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.9;
      u.onend = fin;
      u.onerror = fin;
      s.speak(u);
      this.safety = setTimeout(fin, 2500 + text.length * 120);
    } catch (e) { this.t = setTimeout(fin, 1200); }
  }

  clearTimers() {
    clearTimeout(this.t);
    clearTimeout(this.safety);
  }

  run(i) {
    if (!this.on) return;
    const w = this.words[i];
    this.setState({ i: i, phase: 'en' });
    this.say(w.en, 'en-US', () => {
      if (!this.on) return;
      this.setState({ phase: 'think' });
      this.t = setTimeout(() => {
        if (!this.on) return;
        this.setState({ phase: 'es' });
        this.say(w.es, 'es-ES', () => {
          if (!this.on) return;
          this.t = setTimeout(() => this.run((i + 1) % this.words.length), 1500);
        });
      }, this.state.pause * 1000);
    });
  }

  start(i) {
    this.stop();
    this.on = true;
    this.setState({ playing: true });
    this.run(i);
  }

  stop() {
    this.on = false;
    this.clearTimers();
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  }

  componentWillUnmount() {
    this.stop();
  }

  renderVals() {
    const n = this.words.length;
    const w = this.words[this.state.i];
    const ph = this.state.phase;
    const playing = this.state.playing;
    const labels = { idle: 'Pulsa play para empezar', en: 'Escucha…', think: 'Piensa la respuesta', es: 'Respuesta' };
    const stepDefs = [
      { key: 'en', num: '1', label: 'Inglés' },
      { key: 'think', num: '2', label: 'Piensas' },
      { key: 'es', num: '3', label: 'Español' }
    ];
    const steps = stepDefs.map((s) => {
      const active = s.key === ph;
      return { num: s.num, label: s.label, bg: active ? '#FFE066' : '#2A2926', fg: active ? '#1C1B19' : '#CFC8B8' };
    });
    const pauses = [3, 5, 8].map((sec) => {
      const sel = sec === this.state.pause;
      return {
        label: sec + ' s',
        bg: sel ? '#F3EFE6' : 'transparent',
        fg: sel ? '#1C1B19' : '#F3EFE6',
        bd: sel ? '#F3EFE6' : '#6B6457',
        pick: () => this.setState({ pause: sec })
      };
    });
    return {
      postit: this.props.postit ?? '#FFE066',
      w: w,
      counter: 'Palabra ' + (this.state.i + 1) + ' de ' + n,
      phaseLabel: labels[ph] || labels.idle,
      showEs: ph === 'es',
      hideEs: ph !== 'es',
      steps: steps,
      pauses: pauses,
      playing: playing,
      paused: !playing,
      playAria: playing ? 'Pausar' : 'Reproducir',
      toggle: () => {
        if (this.state.playing) { this.stop(); this.setState({ playing: false, phase: 'idle' }); }
        else { this.start(this.state.i); }
      },
      skip: () => {
        const next = (this.state.i + 1) % n;
        if (this.state.playing) this.start(next);
        else this.setState({ i: next, phase: 'idle' });
      },
      replay: () => {
        if (this.state.playing) this.start(this.state.i);
        else { try { window.speechSynthesis.cancel(); } catch (e) {} this.say(w.en, 'en-US', null); }
      }
    };
  }
}
</script>
